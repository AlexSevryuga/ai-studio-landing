<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#0f0f12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="630" rx="0" ry="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Accent glow — top right -->
  <ellipse cx="900" cy="150" rx="350" ry="250" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Accent glow — bottom left -->
  <ellipse cx="300" cy="500" rx="250" ry="200" fill="url(#glowGrad)" opacity="0.4" filter="url(#glow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" ry="0" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Brand mark -->
  <text x="80" y="100" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="url(#accentGrad)">✦ AI Studio</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#e4e4e7" letter-spacing="-2">
    Turn Your Book Into
  </text>
  <text x="80" y="310" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#accentGrad)" letter-spacing="-2">
    Film, Animation &amp; Games
  </text>

  <!-- Subtitle -->
  <text x="80" y="375" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#a1a1aa">
    AI-powered pipeline from manuscript to cinematic content.
  </text>
  <text x="80" y="405" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#a1a1aa">
    Powered by GPT-4o, Claude &amp; Veo 3.1.
  </text>

  <!-- Decorative elements — small book icon -->
  <g transform="translate(900, 250)" opacity="0.6">
    <rect x="0" y="0" width="80" height="110" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <rect x="-5" y="0" width="5" height="110" rx="2" fill="#7c3aed"/>
    <line x1="16" y1="24" x2="64" y2="24" stroke="#27272a" stroke-width="2"/>
    <line x1="16" y1="36" x2="56" y2="36" stroke="#27272a" stroke-width="2"/>
    <line x1="16" y1="48" x2="60" y2="48" stroke="#27272a" stroke-width="2"/>
    <line x1="16" y1="60" x2="44" y2="60" stroke="#27272a" stroke-width="2"/>
  </g>

  <!-- Arrow -->
  <g transform="translate(1010, 295)" opacity="0.5">
    <line x1="0" y1="0" x2="50" y2="0" stroke="url(#accentGrad)" stroke-width="2"/>
    <polygon points="50,-5 60,0 50,5" fill="#a78bfa"/>
  </g>

  <!-- Film reel icon -->
  <g transform="translate(1080, 265)" opacity="0.6">
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <polygon points="48,20 38,14 38,26" fill="#7c3aed"/>
    <rect x="0" y="50" width="60" height="40" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="30" cy="70" r="8" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="30" cy="70" r="3" fill="#60a5fa"/>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="#0c0c0e" opacity="0.6"/>
  <line x1="0" y1="530" x2="1200" y2="530" stroke="#27272a" stroke-width="1"/>

  <!-- Bottom bar — tech logos -->
  <text x="80" y="572" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#52525b" text-transform="uppercase" letter-spacing="2">POWERED BY</text>
  <text x="220" y="572" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#71717a">OpenAI</text>
  <text x="310" y="572" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#71717a">·</text>
  <text x="335" y="572" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#71717a">Claude</text>
  <text x="415" y="572" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#71717a">·</text>
  <text x="440" y="572" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#71717a">Veo 3.1</text>

  <!-- URL -->
  <text x="1120" y="572" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#52525b" text-anchor="end">ai-studio.dev</text>
</svg>